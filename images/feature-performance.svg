<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="perf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A4161A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Athletic shoe -->
  <ellipse cx="200" cy="160" rx="75" ry="35" fill="url(#perf-grad)"/>
  <!-- Sport mesh -->
  <g stroke="#fff" stroke-width="1" opacity="0.5">
    <path d="M 140 150 L 260 150"/>
    <path d="M 135 160 L 265 160"/>
    <path d="M 140 170 L 260 170"/>
  </g>
  <!-- Speed lines -->
  <g stroke="#fff" stroke-width="2" opacity="0.7">
    <path d="M 100 155 L 130 155"/>
    <path d="M 95 165 L 125 165"/>
    <path d="M 275 155 L 305 155"/>
    <path d="M 270 165 L 300 165"/>
  </g>
  <!-- Sole -->
  <ellipse cx="200" cy="190" rx="80" ry="12" fill="#333"/>
  <text x="200" y="100" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">⚡</text>
  <text x="200" y="230" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">High Performance</text>
</svg>