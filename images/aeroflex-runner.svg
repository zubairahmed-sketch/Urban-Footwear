<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E72;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Shoe body -->
  <ellipse cx="200" cy="180" rx="80" ry="40" fill="url(#grad1)"/>
  <!-- Toe box -->
  <path d="M 280 180 Q 300 150 320 160 Q 310 190 280 190 Z" fill="#FF5252"/>
  <!-- Heel -->
  <path d="M 120 180 Q 100 160 80 170 Q 90 190 120 190 Z" fill="#FF5252"/>
  <!-- Mesh pattern -->
  <g stroke="#fff" stroke-width="2" opacity="0.6">
    <line x1="150" y1="170" x2="250" y2="170"/>
    <line x1="145" y1="180" x2="255" y2="180"/>
    <line x1="150" y1="190" x2="250" y2="190"/>
  </g>
  <!-- Sole -->
  <ellipse cx="200" cy="210" rx="85" ry="15" fill="#333"/>
  <!-- Text label -->
  <text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">AeroFlex Runner</text>
  <text x="200" y="75" text-anchor="middle" font-size="14" fill="#666">Running</text>
</svg>