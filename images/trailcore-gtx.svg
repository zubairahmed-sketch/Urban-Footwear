<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Boot body -->
  <ellipse cx="200" cy="190" rx="75" ry="50" fill="url(#grad2)"/>
  <!-- Waterproof calf -->
  <ellipse cx="200" cy="120" rx="70" ry="45" fill="#388E3C"/>
  <!-- Connection -->
  <rect x="135" y="145" width="130" height="50" fill="#2E7D32"/>
  <!-- Toe box reinforcement -->
  <path d="M 270 190 Q 300 160 320 170 Q 310 210 270 200 Z" fill="#1B5E20"/>
  <!-- Tread pattern -->
  <g fill="#000" opacity="0.3">
    <circle cx="150" cy="210" r="8"/>
    <circle cx="200" cy="220" r="8"/>
    <circle cx="250" cy="210" r="8"/>
    <circle cx="175" cy="240" r="6"/>
    <circle cx="225" cy="240" r="6"/>
  </g>
  <!-- Sole with lugs -->
  <ellipse cx="200" cy="240" rx="80" ry="18" fill="#111"/>
  <!-- Gore-Tex indicator -->
  <text x="200" y="140" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Gore-Tex</text>
  <!-- Text label -->
  <text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">TrailCore GTX</text>
  <text x="200" y="75" text-anchor="middle" font-size="14" fill="#666">Trail</text>
</svg>