<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="leather" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#3d3d3d"/>
      <circle cx="2" cy="2" r="1" fill="#4d4d4d" opacity="0.5"/>
      <circle cx="7" cy="7" r="1" fill="#4d4d4d" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Shoe body -->
  <ellipse cx="200" cy="180" rx="80" ry="40" fill="url(#leather)"/>
  <!-- Suede overlay -->
  <ellipse cx="200" cy="170" rx="70" ry="30" fill="#4a4a4a" opacity="0.8"/>
  <!-- Toe box leather -->
  <path d="M 270 180 Q 295 155 315 165 Q 305 195 270 190 Z" fill="#3d3d3d"/>
  <!-- Heel -->
  <path d="M 130 180 Q 105 160 85 170 Q 95 195 130 190 Z" fill="#3d3d3d"/>
  <!-- Laces -->
  <g stroke="#8B7355" stroke-width="3" fill="none">
    <path d="M 190 150 Q 200 140 210 150"/>
    <path d="M 185 160 Q 200 155 215 160"/>
    <path d="M 180 170 Q 200 168 220 170"/>
  </g>
  <!-- Sole -->
  <ellipse cx="200" cy="210" rx="85" ry="15" fill="#2d2d2d"/>
  <!-- Text label -->
  <text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">CityStride Leather</text>
  <text x="200" y="75" text-anchor="middle" font-size="14" fill="#666">Lifestyle</text>
</svg>