<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fallback-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#757575;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#424242;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Generic shoe -->
  <ellipse cx="200" cy="180" rx="80" ry="40" fill="url(#fallback-grad)"/>
  <!-- Accent -->
  <ellipse cx="200" cy="170" rx="70" ry="32" fill="#616161"/>
  <!-- Shoe details -->
  <g stroke="#fff" stroke-width="2" opacity="0.4">
    <path d="M 160 170 Q 200 160 240 170"/>
    <path d="M 155 180 Q 200 175 245 180"/>
  </g>
  <!-- Sole -->
  <ellipse cx="200" cy="210" rx="85" ry="15" fill="#212121"/>
  <!-- Question mark for placeholder -->
  <text x="200" y="120" text-anchor="middle" font-size="48" font-weight="bold" fill="#616161" opacity="0.5">?</text>
  <text x="200" y="250" text-anchor="middle" font-size="16" fill="#757575">Product Image</text>
</svg>