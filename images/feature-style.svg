<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="style-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#457B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D3557;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Trendy shoe with style -->
  <ellipse cx="200" cy="160" rx="75" ry="35" fill="url(#style-grad)"/>
  <!-- Designer accent -->
  <ellipse cx="200" cy="150" rx="65" ry="28" fill="#457B9D" opacity="0.8"/>
  <!-- Style elements -->
  <circle cx="170" cy="145" r="4" fill="#F1FAEE"/>
  <circle cx="230" cy="145" r="4" fill="#F1FAEE"/>
  <circle cx="200" cy="155" r="3" fill="#F1FAEE"/>
  <!-- Fashion lines -->
  <g stroke="#F1FAEE" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 145 160 L 255 160"/>
  </g>
  <!-- Sole -->
  <ellipse cx="200" cy="190" rx="80" ry="12" fill="#333"/>
  <text x="200" y="100" text-anchor="middle" font-size="28" font-weight="bold" fill="#457B9D">✨</text>
  <text x="200" y="230" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Modern Style</text>
</svg>