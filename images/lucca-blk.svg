<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lucca-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Derby shoe body -->
  <ellipse cx="200" cy="175" rx="85" ry="38" fill="url(#lucca-grad)"/>
  <!-- Toe box -->
  <path d="M 285 175 Q 320 155 340 165 Q 325 195 285 185 Z" fill="#0d0d0d"/>
  <!-- Heel counter -->
  <path d="M 115 175 Q 85 160 70 170 Q 80 190 115 185 Z" fill="#0d0d0d"/>
  <!-- Derby open lacing flaps -->
  <path d="M 160 145 L 175 185 L 185 185 L 175 145 Z" fill="#222"/>
  <path d="M 240 145 L 225 185 L 215 185 L 225 145 Z" fill="#222"/>
  <!-- Lace eyelets (silver) -->
  <g fill="#888">
    <circle cx="178" cy="155" r="3"/>
    <circle cx="222" cy="155" r="3"/>
    <circle cx="180" cy="168" r="3"/>
    <circle cx="220" cy="168" r="3"/>
    <circle cx="183" cy="180" r="3"/>
    <circle cx="217" cy="180" r="3"/>
  </g>
  <!-- Laces -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M 178 155 L 222 155"/>
    <path d="M 180 168 L 220 168"/>
    <path d="M 183 180 L 217 180"/>
  </g>
  <!-- Hand-stitched detailing -->
  <ellipse cx="200" cy="175" rx="78" ry="32" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <path d="M 280 175 Q 295 165 305 170" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Polished shine effect -->
  <ellipse cx="300" cy="165" rx="15" ry="8" fill="#fff" opacity="0.15"/>
  <!-- Sole -->
  <ellipse cx="200" cy="205" rx="90" ry="12" fill="#000"/>
  <!-- Heel -->
  <rect x="100" y="200" width="40" height="15" fill="#000" rx="2"/>
  <!-- Text label -->
  <text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Lucca-BLK</text>
  <text x="200" y="75" text-anchor="middle" font-size="14" fill="#666">Formal</text>
</svg>