<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Racing shoe body - sleek -->
  <ellipse cx="200" cy="180" rx="85" ry="35" fill="url(#grad5)"/>
  <!-- Composite forefoot plate indicator -->
  <ellipse cx="260" cy="185" rx="25" ry="20" fill="#F57C00" opacity="0.8"/>
  <text x="260" y="190" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Plate</text>
  <!-- Nitrogen foam upper -->
  <path d="M 130 170 Q 140 160 200 155 Q 260 160 270 170 L 265 185 Q 200 188 135 185 Z" fill="#FF9800"/>
  <!-- Decoupled heel -->
  <ellipse cx="110" cy="190" rx="35" ry="20" fill="#F57C00"/>
  <!-- Racing laces -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M 190 155 L 185 170"/>
    <path d="M 210 155 L 215 170"/>
    <path d="M 200 155 L 200 180"/>
  </g>
  <!-- Speed stripes -->
  <g stroke="#FFF" stroke-width="3" opacity="0.6" fill="none">
    <path d="M 140 175 L 160 175"/>
    <path d="M 240 175 L 260 175"/>
  </g>
  <!-- Sole -->
  <ellipse cx="200" cy="210" rx="90" ry="12" fill="#212121"/>
  <!-- Text label -->
  <text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">SprintVelocity</text>
  <text x="200" y="75" text-anchor="middle" font-size="14" fill="#666">Running</text>
</svg>