<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="galore-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#800020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5C0015;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Boot body -->
  <ellipse cx="200" cy="190" rx="75" ry="45" fill="url(#galore-grad)"/>
  <!-- Boot shaft/ankle -->
  <rect x="140" y="120" width="120" height="75" fill="#800020" rx="8"/>
  <!-- Top collar -->
  <ellipse cx="200" cy="120" rx="60" ry="15" fill="#6B001A"/>
  <!-- Toe box -->
  <path d="M 275 190 Q 310 165 330 175 Q 315 210 275 200 Z" fill="#5C0015"/>
  <!-- Heel counter -->
  <path d="M 125 190 Q 95 170 80 180 Q 90 205 125 200 Z" fill="#5C0015"/>
  <!-- Lacing panel -->
  <rect x="180" y="125" width="40" height="60" fill="#6B001A" rx="3"/>
  <!-- Lace eyelets (brass) -->
  <g fill="#B8860B">
    <circle cx="190" cy="135" r="3"/>
    <circle cx="210" cy="135" r="3"/>
    <circle cx="190" cy="150" r="3"/>
    <circle cx="210" cy="150" r="3"/>
    <circle cx="190" cy="165" r="3"/>
    <circle cx="210" cy="165" r="3"/>
  </g>
  <!-- Laces -->
  <g stroke="#2d2d2d" stroke-width="2" fill="none">
    <path d="M 190 135 L 210 135"/>
    <path d="M 190 150 L 210 150"/>
    <path d="M 190 165 L 210 165"/>
  </g>
  <!-- Stitching details -->
  <ellipse cx="200" cy="190" rx="70" ry="40" fill="none" stroke="#4A0012" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Pull tab -->
  <rect x="195" y="110" width="10" height="15" fill="#5C0015" rx="2"/>
  <!-- Rugged sole -->
  <ellipse cx="200" cy="230" rx="80" ry="15" fill="#1a1a1a"/>
  <!-- Heel block -->
  <rect x="110" y="220" width="35" height="20" fill="#1a1a1a" rx="3"/>
  <!-- Text label -->
  <text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Galore-MRN</text>
  <text x="200" y="75" text-anchor="middle" font-size="14" fill="#666">Boots</text>
</svg>