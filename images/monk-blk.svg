<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="monk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Monk strap shoe body -->
  <ellipse cx="200" cy="175" rx="85" ry="38" fill="url(#monk-grad)"/>
  <!-- Toe box -->
  <path d="M 285 175 Q 320 155 340 165 Q 325 195 285 185 Z" fill="#0d0d0d"/>
  <!-- Heel counter -->
  <path d="M 115 175 Q 85 160 70 170 Q 80 190 115 185 Z" fill="#0d0d0d"/>
  <!-- Monk strap panel -->
  <rect x="155" y="155" width="90" height="30" fill="#111" rx="3"/>
  <!-- Double buckle straps -->
  <g fill="#222">
    <rect x="160" y="158" width="35" height="24" rx="2"/>
    <rect x="205" y="158" width="35" height="24" rx="2"/>
  </g>
  <!-- Buckles (silver/gold) -->
  <g fill="#C0C0C0" stroke="#999" stroke-width="1">
    <rect x="165" y="163" width="12" height="14" rx="2"/>
    <rect x="210" y="163" width="12" height="14" rx="2"/>
  </g>
  <!-- Buckle prongs -->
  <g fill="#888">
    <rect x="169" y="166" width="4" height="8" rx="1"/>
    <rect x="214" y="166" width="4" height="8" rx="1"/>
  </g>
  <!-- Strap lines -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="180" y1="160" x2="180" y2="180"/>
    <line x1="225" y1="160" x2="225" y2="180"/>
  </g>
  <!-- Polished shine effect -->
  <ellipse cx="300" cy="165" rx="15" ry="8" fill="#fff" opacity="0.15"/>
  <ellipse cx="140" cy="170" rx="12" ry="6" fill="#fff" opacity="0.1"/>
  <!-- Stitching details -->
  <ellipse cx="200" cy="175" rx="80" ry="33" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Sole -->
  <ellipse cx="200" cy="205" rx="90" ry="12" fill="#000"/>
  <!-- Heel -->
  <rect x="100" y="200" width="40" height="15" fill="#000" rx="2"/>
  <!-- Text label -->
  <text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Monk-BLK</text>
  <text x="200" y="75" text-anchor="middle" font-size="14" fill="#666">Premium</text>
</svg>