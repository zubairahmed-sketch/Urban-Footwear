<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#f5f5f5"/>
  <!-- Trainer shoe body -->
  <ellipse cx="200" cy="180" rx="80" ry="40" fill="url(#grad7)"/>
  <!-- TPU sidewalls -->
  <path d="M 120 160 L 110 190 L 140 195 L 150 165 Z" fill="#7B1FA2" stroke="#6A1B9A" stroke-width="2"/>
  <path d="M 280 160 L 290 190 L 260 195 L 250 165 Z" fill="#7B1FA2" stroke="#6A1B9A" stroke-width="2"/>
  <!-- Ventilated tongue pattern -->
  <g fill="#E91E63" opacity="0.7">
    <circle cx="200" cy="155" r="5"/>
    <circle cx="190" cy="160" r="4"/>
    <circle cx="210" cy="160" r="4"/>
    <circle cx="185" cy="170" r="3"/>
    <circle cx="215" cy="170" r="3"/>
  </g>
  <!-- Heel clip -->
  <rect x="175" y="200" width="50" height="15" fill="#6A1B9A" rx="5"/>
  <text x="200" y="211" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Clip</text>
  <!-- Training markers -->
  <g stroke="#fff" stroke-width="2" opacity="0.6">
    <line x1="160" y1="180" x2="180" y2="180"/>
    <line x1="220" y1="180" x2="240" y2="180"/>
  </g>
  <!-- Sole -->
  <ellipse cx="200" cy="210" rx="85" ry="15" fill="#2d2d2d"/>
  <!-- Text label -->
  <text x="200" y="50" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Pulse Trainer Pro</text>
  <text x="200" y="75" text-anchor="middle" font-size="14" fill="#666">Training</text>
</svg>